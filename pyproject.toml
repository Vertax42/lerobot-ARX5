[build-system]
requires = ["setuptools>=71.0.0,<81.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://huggingface.co/lerobot"
documentation = "https://huggingface.co/docs/lerobot/index"
source = "https://github.com/huggingface/lerobot"
issues = "https://github.com/huggingface/lerobot/issues"
discord = "https://discord.gg/s3KuuzsPFb"

[project]
name = "lerobot"
version = "0.4.1"
description = "🤗 LeRobot (minimal): lightweight kernel — datasets / record / replay / teleoperate"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Rémi Cadène", email = "re.cadene@gmail.com" },
    { name = "Simon Alibert", email = "alibert.sim@gmail.com" },
    { name = "Alexander Soare", email = "alexander.soare159@gmail.com" },
    { name = "Quentin Gallouédec", email = "quentin.gallouedec@ec-lyon.fr" },
    { name = "Steven Palma", email = "imstevenpmwork@ieee.org" },
    { name = "Pepijn Kooijmans", email = "pepijnkooijmans@outlook.com" },
    { name = "Michel Aractingi", email = "michel.aractingi@gmail.com" },
    { name = "Adil Zouitine", email = "adilzouitinegm@gmail.com" },
    { name = "Dana Aubakirova", email = "danaaubakirova17@gmail.com" },
    { name = "Caroline Pascal", email = "caroline8.pascal@gmail.com" },
    { name = "Martino Russi", email = "nopyeps@gmail.com" },
    { name = "Thomas Wolf", email = "thomaswolfcontact@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "lerobot",
    "huggingface",
    "robotics",
    "machine learning",
    "artificial intelligence",
]

dependencies = [
    # Hugging Face
    "datasets>=4.0.0,<4.2.0",
    "huggingface-hub[hf-transfer,cli]>=0.34.2,<0.36.0",

    # Build / packaging
    "setuptools>=71.0.0,<81.0.0",
    "cmake>=3.29.0.1,<4.2.0",
    "packaging>=24.2,<26.0",

    # Core numerics / IO
    "einops>=0.8.0,<0.9.0",
    "opencv-python-headless>=4.9.0,<4.13.0",
    "av>=15.0.0,<16.0.0",
    "jsonlines>=4.0.0,<5.0.0",
    "scikit-image",
    "deepdiff>=7.0.1,<9.0.0",
    "imageio[ffmpeg]>=2.34.0,<3.0.0",
    "termcolor>=2.4.0,<4.0.0",
    "tqdm",

    # Logging
    "spdlog",

    # IO
    "pynput>=1.7.7,<1.9.0",
    "pyserial>=3.5,<4.0",

    # Torch stack
    "torch>=2.2.1,<2.8.1",
    "torchcodec==0.7.0; sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "torchvision>=0.21.0,<0.24.0",

    # Config / viz
    "draccus==0.10.0",
    "rerun-sdk == 0.23.1",
    "wandb>=0.20.0,<0.22.0",
]

[project.optional-dependencies]

# Xense tactile cameras (requires third_party/xensesdk submodule built + installed)
xense = ["xensesdk>=1.7.0"]

# Motor SDKs
feetech = ["feetech-servo-sdk>=1.0.0,<2.0.0"]
dynamixel = ["dynamixel-sdk>=3.7.31,<3.9.0"]

# Cameras
intelrealsense = [
    "pyrealsense2>=2.55.1.6486,<2.57.0 ; sys_platform != 'darwin'",
    "pyrealsense2-macosx>=2.54,<2.55.0 ; sys_platform == 'darwin'",
]

# Teleop
gamepad = ["pygame>=2.5.1,<2.7.0", "hidapi>=0.14.0,<0.15.0"]

# Development
dev = [
    "pre-commit>=3.7.0,<5.0.0",
    "debugpy>=1.8.1,<1.9.0",
]
test = [
    "pytest>=8.1.0,<9.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "mock-serial>=0.0.1,<0.1.0 ; sys_platform != 'win32'",
]
video_benchmark = ["scikit-image>=0.23.2,<0.26.0", "pandas>=2.2.2,<2.4.0"]

# All lightweight extras
all = [
    "lerobot[xense]",
    "lerobot[dynamixel]",
    "lerobot[feetech]",
    "lerobot[gamepad]",
    "lerobot[intelrealsense]",
    "lerobot[dev]",
    "lerobot[test]",
    "lerobot[video_benchmark]",
]

[project.scripts]
lerobot-calibrate = "lerobot.scripts.lerobot_calibrate:main"
lerobot-find-cameras = "lerobot.scripts.lerobot_find_cameras:main"
lerobot-find-port = "lerobot.scripts.lerobot_find_port:main"
lerobot-record = "lerobot.scripts.lerobot_record:main"
lerobot-replay = "lerobot.scripts.lerobot_replay:main"
lerobot-teleoperate = "lerobot.scripts.lerobot_teleoperate:main"
lerobot-dataset-viz = "lerobot.scripts.lerobot_dataset_viz:main"
lerobot-info = "lerobot.scripts.lerobot_info:main"
lerobot-imgtransform-viz = "lerobot.scripts.lerobot_imgtransform_viz:main"
lerobot-edit-dataset = "lerobot.scripts.lerobot_edit_dataset:main"
lerobot-annotate-reward = "lerobot.scripts.lerobot_annotate_reward:main"
lerobot-test = "lerobot.scripts.lerobot_test:main"

# ---------------- Tool Configurations ----------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["tests/artifacts/**/*.safetensors", "*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM"]
ignore = ["E501", "E203", "T201", "T203", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lerobot"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "benchmarks",
    "src/lerobot/datasets/push_dataset_to_hub",
]
skips = ["B101", "B311", "B404", "B603", "B615"]

[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]
default.extend-ignore-identifiers-re = [
    "2nd",
    "pn",
    "ser",
    "ein",
    "thw",
    "inpt",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "lerobot.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "lerobot.envs.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "lerobot.configs.*"
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "lerobot.cameras.*"
ignore_errors = false
