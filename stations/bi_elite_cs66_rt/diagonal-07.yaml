# Station diagonal-07 — bimanual Elite CS66 RT.
#
# Selected with `bi_mount_type: diagonal-07` in a recipe, or
# `--robot.bi_mount_type=diagonal-07` on the CLI.
#
# Hardware only. Control/tuning knobs (servo gains, singularity guards, gripper
# force, tactile on/off) belong in recipes/, not here — a station describes what
# is bolted to the bench, not how a given run drives it.
#
# Grippers are absent on purpose: both backends resolve left/right at connect
# (serial by board-SN parity, taccap by the firmware-burned SN), so there is no
# per-bench gripper identity to pin.
#
# Anything set here is a DEFAULT — an explicit value in a recipe or on the CLI
# wins. See stations/README.md.
#
# ── Mounting ────────────────────────────────────────────────────────────────
# The two CS66 arms are mounted diagonally/opposed. Each arm's `mount` block
# gives the world<-base rotation R that lifts base-frame TCP poses into ONE
# SHARED gravity-aligned world frame (x = facing, y = left, z = up), matching
# the Flexiv convention so recorded data is comparable across robots.
#
# From angles:  R = Rz(world_yaw)·Rz(zrot)·Rx(tilt)
#   tilt_deg (α)      tilt about base-X    ┐ BOTH read off the teach pendant
#   zrot_deg (β)      rotation about Z     ┘ (both controllers read α=45, β=90).
#                     These two only fix the gravity vector in base (recover
#                     "z up"); they do NOT fix the heading.
#   world_yaw_deg (γ) extra yaw about world-Z aligning each arm's heading into
#                     the one shared world frame. The arms are mounted
#                     point-symmetrically and so face opposite directions:
#                     right γ=0° (defines the world), left γ=180°. The teach
#                     pendant CANNOT show this 180° — it is the residual yaw
#                     about gravity.
#
# `world_rotation` (rows = world X/Y/Z axes in base) OVERRIDES the angle build
# for that arm, and is what is actually in force on this bench. The pendant's
# 45/90 assumed a tilt about base-X, but the LEFT arm is actually tilted 45°
# about base-Y — verified two ways: a freedrive-probe measurement, and the
# base-link geometry. The matrix below == base rotated about Z by 90° then
# about Y by 45°, giving world X(fwd) = base +Y and world Z(up) = [.707, 0, .707].
#
# RIGHT is the point-symmetric partner of the (validated) LEFT:
#   R_right = Rz(180)·R_left     forward flips to base -Y, up stays [.707,0,.707]
# Earlier, Rz(90°)·Rx(45°) for the right arm was validated empirically (a base-X
# 130° pose put the tool +Z approach axis straight down).
#
# The angles are kept alongside the matrix even though they are inert here:
# they record what the pendant actually reads, which is the starting point when
# re-deriving the mounting on a new bench.
#
# VERIFY on-station with the axis test before trusting the right arm; if the
# heading comes out yawed, re-measure it with the freedrive probe like the left.

name: diagonal-07
robot_type: bi_elite_cs66_rt

arms:
  left:
    ip: 192.168.207.129
    local_ip: ""
    # J1..J6 radians == [-80, -30, 90, -30, 90, 0] deg, measured on-station.
    start_rad: [-1.3963, -0.5236, 1.5708, -0.5236, 1.5708, -0.7854]
    home_rad:  [-1.3963, -0.5236, 1.5708, -0.5236, 1.5708, -0.7854]
    mount:
      tilt_deg: 45.0
      zrot_deg: 90.0
      world_yaw_deg: 180.0
      world_rotation:
        - [0.0, 1.0, 0.0]
        - [-0.70710678, 0.0, 0.70710678]
        - [0.70710678, 0.0, 0.70710678]
  right:
    ip: 192.168.207.108
    local_ip: ""
    # J1..J6 radians == [-100, -150, -90, -150, -90, 0] deg, measured on-station.
    start_rad: [-1.7453, -2.618, -1.5708, -2.618, -1.5708, -0.7854]
    home_rad:  [-1.7453, -2.618, -1.5708, -2.618, -1.5708, -0.7854]
    mount:
      tilt_deg: 45.0
      zrot_deg: 90.0
      world_yaw_deg: 0.0
      world_rotation:
        - [0.0, -1.0, 0.0]
        - [0.70710678, 0.0, -0.70710678]
        - [0.70710678, 0.0, 0.70710678]

cameras:
  head:            {type: realsense,     serial: "347522071393"}
  left_wrist:      {type: opencv,        serial: XC000043}
  right_wrist:     {type: opencv,        serial: XC000044}
  left_tactile_0:  {type: xense_tactile, serial: OG001345}
  left_tactile_1:  {type: xense_tactile, serial: OG001346}
  right_tactile_0: {type: xense_tactile, serial: OG001347}
  right_tactile_1: {type: xense_tactile, serial: OG001348}
