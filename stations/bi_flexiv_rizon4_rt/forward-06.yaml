# Station forward-06 — bimanual Flexiv Rizon4 RT.
#
# Selected with `bi_mount_type: forward-06` in a recipe, or
# `--robot.bi_mount_type=forward-06` on the CLI.
#
# Hardware only. Control/tuning knobs (force control, servo rates, gripper
# force, tactile on/off) belong in recipes/, not here — a station describes what
# is bolted to the bench, not how a given run drives it.
#
# Grippers are absent on purpose: both backends resolve left/right at connect
# (serial by board-SN parity, taccap by the firmware-burned SN), so there is no
# per-bench gripper identity to pin.
#
# Anything set here is a DEFAULT — an explicit value in a recipe or on the CLI
# wins. See stations/README.md.

name: forward-06
robot_type: bi_flexiv_rizon4_rt

arms:
  left:
    serial_number: Rizon4s-062412
    start_deg: [88.79, 74.96, 22.75, 112.75, -0.39, 86.74, 1.24]
    home_deg:  [88.79, 74.96, 22.75, 112.75, -0.39, 86.74, 1.24]
  right:
    serial_number: Rizon4s-062881
    start_deg: [-24.41, 71.36, -4.67, 118.53, 3.91, 96.15, 3.6]
    home_deg:  [-24.41, 71.36, -4.67, 118.53, 3.91, 96.15, 3.6]

cameras:
  head:            {type: realsense,     serial: "254322071102"}
  left_wrist:      {type: opencv,        serial: XC000035}
  right_wrist:     {type: opencv,        serial: XC000036}
  left_tactile_0:  {type: xense_tactile, serial: OG001323}
  left_tactile_1:  {type: xense_tactile, serial: OG001324}
  right_tactile_0: {type: xense_tactile, serial: OG001325}
  right_tactile_1: {type: xense_tactile, serial: OG001326}
