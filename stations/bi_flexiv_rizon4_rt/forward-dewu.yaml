# Station forward-dewu — bimanual Flexiv Rizon4 RT.
#
# Selected with `bi_mount_type: forward-dewu` in a recipe, or
# `--robot.bi_mount_type=forward-dewu` on the CLI.
#
# Hardware only. Control/tuning knobs (force control, servo rates, gripper
# force, tactile on/off) belong in recipes/, not here — a station describes what
# is bolted to the bench, not how a given run drives it.
#
# Grippers are absent on purpose: both backends resolve left/right at connect
# (serial by board-SN parity, taccap by the firmware-burned SN), so there is no
# per-bench gripper identity to pin.
#
# Anything set here is a DEFAULT — an explicit value in a recipe or on the CLI
# wins. See stations/README.md.

name: forward-dewu
robot_type: bi_flexiv_rizon4_rt

arms:
  left:
    serial_number: Rizon4s-063458
    start_deg: [105.16, 66.69, -6.37, 77.95, 76.3, -2.83, -102.67]
    home_deg:  [105.16, 66.69, -6.37, 77.95, 76.3, -2.83, -102.67]
  right:
    serial_number: Rizon4s-063670
    start_deg: [-22.97, 65.41, 12.12, 98.98, -68.95, 0.55, 125.45]
    home_deg:  [-22.97, 65.41, 12.12, 98.98, -68.95, 0.55, 125.45]

cameras:
  head:            {type: realsense,     serial: "337322070722"}
  left_wrist:      {type: opencv,        serial: XC000021}
  right_wrist:     {type: opencv,        serial: XC000012}
  left_tactile_0:  {type: xense_tactile, serial: OG000950}
  left_tactile_1:  {type: xense_tactile, serial: OG000949}
  right_tactile_0: {type: xense_tactile, serial: OG001310}
  right_tactile_1: {type: xense_tactile, serial: OG001311}
