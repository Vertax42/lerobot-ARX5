# Station forward-05 — bimanual Flexiv Rizon4 RT.
#
# Selected with `bi_mount_type: forward-05` in a recipe, or
# `--robot.bi_mount_type=forward-05` on the CLI.
#
# Hardware only. Control/tuning knobs (force control, servo rates, gripper
# force, tactile on/off) belong in recipes/, not here — a station describes what
# is bolted to the bench, not how a given run drives it.
#
# Grippers are absent on purpose: both backends resolve left/right at connect
# (serial by board-SN parity, taccap by the firmware-burned SN), so there is no
# per-bench gripper identity to pin.
#
# Anything set here is a DEFAULT — an explicit value in a recipe or on the CLI
# wins. See stations/README.md.

name: forward-05
robot_type: bi_flexiv_rizon4_rt

arms:
  left:
    serial_number: Rizon4-063786
    start_deg: [96.59, 65.45, -6.65, 78.76, 85.09, -5.48, -103.47]
    home_deg:  [96.59, 65.45, -6.65, 78.76, 85.09, -5.48, -103.47]
  right:
    serial_number: Rizon4R-062096
    start_deg: [96.93, 65.4, -7.06, 78.87, 85.03, -5.68, -103.2]
    home_deg:  [96.93, 65.4, -7.06, 78.87, 85.03, -5.68, -103.2]

cameras:
  head:            {type: realsense,     serial: "346522071766"}
  left_wrist:      {type: opencv,        serial: XC000047}
  right_wrist:     {type: opencv,        serial: XC000054}
  left_tactile_0:  {type: xense_tactile, serial: OG001359}
  left_tactile_1:  {type: xense_tactile, serial: OG001360}
  right_tactile_0: {type: xense_tactile, serial: OG001369}
  right_tactile_1: {type: xense_tactile, serial: OG001370}
