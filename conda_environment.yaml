name: lerobot-xense
channels:
  - robostack-jazzy # ros-humble-kdl-parser, ros-humble-ament-cmake for ARX5
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.12
  # ── Build tools (required for ARX5 / Flexiv C++ builds) ──────────────────
  - cxx-compiler
  # Pinned <4.2 to agree with pyproject.toml's `cmake>=3.29.0.1,<4.2.0`. Without
  # the upper bound conda resolves 4.3.x, then `uv pip install -e .` downgrades
  # to the PyPI cmake and overwrites conda's bin/cmake, ccmake, cpack, ctest.
  - cmake>=3.29,<4.2
  - ninja
  # ── C++ libraries (ARX5 / Flexiv Python bindings) ─────────────────────────
  - pybind11
  - eigen=3.4.0
  - orocos-kdl
  - boost
  - spdlog=1.14.1
  - ros-jazzy-kdl-parser
  - ros-jazzy-ament-cmake # ARX5 SDK CMake build dependency
  - conda-forge::soem=1.4.0 # ARX5 EtherCAT; omit on aarch64, build from source
  - libhidapi
  - libstdcxx-ng # newer CXXABI symbols (xensevr_pc_service_sdk)
  # ── taccap-gripper C++ build deps (libxense-lite) ─────────────────────────
  # Solved here WITH the robostack ROS stack so they share one coherent solve.
  # Do NOT pin libopencv=4.12: that build links libprotobuf 6.31 and conflicts
  # with robostack's ros2-distro-mutex (libprotobuf 6.33.5), which would evict
  # ros-humble-kdl-parser and break pyarx. 4.13 links 6.33.5 and coexists.
  # This is the C++ runtime only; the pip opencv-python wheel (import cv2) is
  # self-contained and unaffected.
  - libopencv>=4.13
  - nlohmann_json=3.11.3
  - zlib=1.3.1 # dev pkg: provides linkable libz.so for libxensesdk find_package(ZLIB)
  - pkg-config
  - make
  # ── CUDA (xensesdk / onnxruntime-gpu) ─────────────────────────────────────
  - nvidia::cuda-toolkit=12.8
  - nvidia::cudnn
  # ── Video (torchcodec / av) ────────────────────────────────────────────────
  # PyAV/torchcodec are installed from wheels later in setup_env.sh. Keeping
  # ffmpeg out of the conda solve avoids ICU/libxml2 conflicts with Robostack.
  # ── Python base tools ─────────────────────────────────────────────────────
  # Upper bound must match the wheel stack: opencv-python pins numpy<2.3.0 and
  # xensesdk pins <=2.2.4, so uv always lands on 2.2.6. Leaving conda unbounded
  # makes it resolve 2.4.6, which uv then overwrites in place -- and 2.4.x turned
  # numpy/ctypeslib.py into a package, so the leftovers shadow each other.
  - numpy>=1.26.4,<2.3 # robostack resolves to 1.26; wheel stack needs 2.2.x
  - pip
  - wheel
  - pip:
      - uv
      - pyrealsense2
      - matplotlib
