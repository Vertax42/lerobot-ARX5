# Teleop recipe — bimanual Flexiv Rizon4 RT (forward mount, bench 04) + Bi-Pico4,
# with TacCap follower grippers (bi_taccap).
#   lerobot-teleoperate --config_path=recipes/teleop/bi_flexiv_rizon4_rt/forward-04-taccap.yaml
#
# Self-contained: this file carries both the bench hardware and the run's tuning.
# Anything not listed uses the dataclass default.
#
# Gripper variant: xgripper. The sibling forward-04-taccap.yaml is the same bench
# with the other gripper family — the two differ only in `gripper:`.
#
# NOT yet run on this bench with serial grippers — the arm block is inherited
# from the forward-04-taccap.yaml recipe, the gripper block is the fleet default.


robot:
  type: bi_flexiv_rizon4_rt

  # ── Bench hardware (forward-04) ─────────────────────────────────────────────
  left_robot_sn: Rizon4-063774
  right_robot_sn: Rizon4R-062090
  # Joint angles in DEGREES (J1..J7), the units flexiv_rt takes.
  left_start_position_degree: [86.9, 68.22, 23.55, 109.63, -3.01, 89.52, 2.96]
  right_start_position_degree: [83.07, 67.85, 24.64, 107.57, 6.39, 95.96, 15.24]
  left_home_position_degree: [86.9, 68.22, 23.55, 109.63, -3.01, 89.52, 2.96]
  right_home_position_degree: [83.07, 67.85, 24.64, 107.57, 6.39, 95.96, 15.24]

  # ── Cameras ─────────────────────────────────────────────────────────────────
  # Only the head is pinned: taccap_auto_discover_cameras (below) sniffs the
  # per-side wrist + GSPS tactile cameras off the gripper's USB hub at connect.
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "344522070461"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false

  # ── Control ─────────────────────────────────────────────────────────────────
  use_force: false
  log_level: INFO
  enable_tactile_sensors: true

  # ── Gripper ── One block for both arms; `side` is stamped per arm at build time.
  # Both grippers -> XenseSerialGripper over USB serial (no IP / MAC / network).
  # Neither port nor sn is pinned: parity discovery reads each board's SN and
  # resolves the side from it, which then anchors the camera sniff above.
  gripper:
    type: serial
    gripper_v_max: 100.0    # mm/s
    gripper_f_max: 30.0     # N
    gripper_min_pos: 0.0    # mm — fully closed
    gripper_max_pos: 85.0   # mm — fully open
    serial_timeout: 1.0
    init_open: true
    auto_discover_cameras: true   # sniff wrist + tactile off this gripper's USB hub
    # Everything else worth tuning, at its default — uncomment to change.
    # port: ""                            # explicit /dev path; overrides sn + side
    # sn: null                            # board SN; scanned across ports when port unset
    # side: null                          # stamped automatically per arm — do not set here
  left_use_gripper: true
  right_use_gripper: true

teleop:
  type: bi_pico4
  pos_sensitivity: 1.0
  ori_sensitivity: 1.0

# ── Teleoperate loop (top level) ──
fps: 30
display_data: true
