# Teleop recipe — bimanual Flexiv Rizon4 RT (diagonal mount, bench 02) + Bi-Pico4,
# with TacCap follower grippers (bi_taccap).
#   lerobot-teleoperate --config_path=recipes/teleop/bi_flexiv_rizon4_rt/diagonal-02.yaml
#
# Self-contained: this file carries both the bench hardware and the run's tuning.
# Anything not listed uses the dataclass default.

robot:
  type: bi_flexiv_rizon4_rt

  # ── Bench hardware (diagonal-02) ────────────────────────────────────────────
  left_robot_sn: Rizon4-063423
  right_robot_sn: Rizon4-062855
  # Joint angles in DEGREES (J1..J7), the units flexiv_rt takes.
  left_start_position_degree: [16.18, -26.29, -3.84, 114.0, 10.66, 84.24, 27.56]
  right_start_position_degree: [31.91, -26.72, -27.42, 122.58, -13.93, 89.42, -1.31]
  left_home_position_degree: [16.18, -26.29, -3.84, 114.0, 10.66, 84.24, 27.56]
  right_home_position_degree: [31.91, -26.72, -27.42, 122.58, -13.93, 89.42, -1.31]

  # ── Cameras ─────────────────────────────────────────────────────────────────
  # Only the head is pinned: taccap_auto_discover_cameras (below) sniffs the
  # per-side wrist + GSPS tactile cameras off the gripper's USB hub at connect.
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "135522074323"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false

  # ── Gripper ─────────────────────────────────────────────────────────────────
  # Both grippers -> xense.taccap FollowerGripper (matched pair, single switch).
  # Wrist + GSPS tactile SNs are auto-discovered at connect (taccap discovery),
  # which is why only the head camera is pinned above.
  gripper_type: taccap_follower
  use_force: false
  log_level: INFO
  left_use_gripper: true
  right_use_gripper: true
  enable_tactile_sensors: true

  taccap_kp: 8.0 # MIT impedance stiffness (Nm/rad)
  taccap_kd: 1.0 # MIT impedance damping (Nm·s/rad)
  # ⚠️ HIGH GRIP FORCE — constant closing feed-forward torque. NEGATIVE = clamp.
  # -3.0 Nm is ~10x the SDK gentle-grasp abort (0.30 Nm) and near the motor's ceiling:
  # it is a hard crush. It is a CONSTANT bias, so the jaw also settles ~3/kp≈0.375 rad
  # short of full open and holds the closed stop under load even empty (runs hot). Back
  # off toward -0.3 if it stalls the motor / can't open / overheats. Bounded |ff|<=3.5.
  taccap_grip_ff: -3.0 # constant MIT feed-forward torque (Nm), negative = closing
  taccap_control_hz: 200 # ControlLoop resubmit rate
  taccap_auto_discover_cameras: true

teleop:
  type: bi_pico4
  pos_sensitivity: 1.0
  ori_sensitivity: 1.0

# ── Teleoperate loop (top level) ──
fps: 30
display_data: true
