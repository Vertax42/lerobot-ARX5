# Teleop recipe — bimanual Flexiv Rizon4 RT (forward mount, bench 05) + Bi-Pico4.
#   lerobot-teleoperate --config_path=recipes/teleop/bi_flexiv_rizon4_rt/forward-05-xgripper.yaml
#
# ⚠️ NOT VERIFIED ON THIS BENCH. Created when stations/ was folded into recipes,
# to preserve the hardware that stations/bi_flexiv_rizon4_rt/forward-05-xgripper.yaml held —
# that bench had no recipe of its own. The arm SNs, poses and camera SNs below are
# exact (transcribed from the station file at 3b964bc6).
#
# ⚠️ THE GRIPPER BACKEND IS A GUESS. This runs `serial` (the dataclass default),
# which is what the old station file's camera list implied — but nothing confirms
# what is actually bolted to this bench. If it has TacCap followers, this will
# hang at connect scanning /dev/ttyACM* for serial gripper boards that aren't
# there; switch to the taccap form (see forward-01-taccap.yaml / forward-04-taccap.yaml,
# where only `head` is pinned and the wrist + tactile cameras are auto-discovered).
# Everything under "Control" is copied from forward-04 and unvalidated here.
#
# Self-contained: this file carries both the bench hardware and the run's tuning.
#
# Gripper variant: taccap. The sibling forward-05-xgripper.yaml is the same bench
# with the other gripper family — the two differ only in `gripper:`.
#
# NOT yet run on this bench with TacCap followers — the arm block is inherited
# from the forward-05-xgripper.yaml recipe, the gripper block is the fleet default. Grip tuning
# (feedforward_torque) is bench work; start gentle.


robot:
  type: bi_flexiv_rizon4_rt

  # ── Bench hardware (forward-05) ─────────────────────────────────────────
  # Joint angles are in DEGREES (J1..J7), the units flexiv_rt takes.
  # Only the head is pinned: both gripper backends sniff their own wrist +
  # tactile cameras off the gripper's USB hub at connect.
  left_robot_sn: Rizon4-063786
  right_robot_sn: Rizon4R-062096
  left_start_position_degree: [96.59, 65.45, -6.65, 78.76, 85.09, -5.48, -103.47]
  right_start_position_degree: [96.93, 65.4, -7.06, 78.87, 85.03, -5.68, -103.2]
  left_home_position_degree: [96.59, 65.45, -6.65, 78.76, 85.09, -5.48, -103.47]
  right_home_position_degree: [96.93, 65.4, -7.06, 78.87, 85.03, -5.68, -103.2]
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "346522071766"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false
    # Wrist + tactile are discovered off each gripper's USB hub at connect
    # (gripper.auto_discover_cameras). What this bench had when the pins were
    # removed, for cross-checking the first discovery run:
    #   left_tactile_0: OG001359
    #   left_tactile_1: OG001360
    #   left_wrist: XC000047
    #   right_tactile_0: OG001369
    #   right_tactile_1: OG001370
    #   right_wrist: XC000054

  # ── Control (copied from forward-04 — unverified here) ──────────────────────
  use_force: false
  log_level: INFO
  # ── Gripper ── One block for both arms; `side` is stamped per arm at build time.
  # Both grippers -> xense.taccap FollowerGripper (matched pair, single switch).
  # auto_discover_cameras sniffs the wrist + GSPS tactile SNs off each gripper's
  # USB hub at connect, which is why only the head camera is pinned above.
  gripper:
    type: taccap_follower
    kp: 8.0                 # MIT impedance stiffness (Nm/rad)
    kd: 1.0                 # MIT impedance damping (Nm·s/rad)
    feedforward_torque: 0.0     # Nm; negative = clamp harder. |ff| <= 3.5
    control_hz: 200         # ControlLoop resubmit rate
    auto_discover_cameras: true
    require_calibrated: true
    init_open: true
    # Everything else worth tuning, at its default — uncomment to change.
    # side: left                          # stamped automatically per arm — do not set here
    # mcu_device: null                    # explicit MCU path; the arm fills this from discovery
  left_use_gripper: true
  right_use_gripper: true
  enable_tactile_sensors: true

teleop:
  type: bi_pico4
  pos_sensitivity: 1.0
  ori_sensitivity: 1.0

# ── Teleoperate loop (top level) ──
fps: 30
display_data: true
