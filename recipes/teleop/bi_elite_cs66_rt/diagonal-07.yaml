# Teleop recipe — bimanual Elite CS66 RT (diagonal mount, station 07) + Bi-Pico4.
# One recipe per physical station; this one targets the diagonal-07 station (.207.129/.108).
#   lerobot-teleoperate --config_path=recipes/teleop/bi_elite_cs66_rt/diagonal-07.yaml
#
# Only the frequently-changed knobs are listed; everything else uses the dataclass
# default. Station hardware comes from stations/bi_elite_cs66_rt/<bi_mount_type>.yaml;
# don't restate it here (a recipe value would override the bench). diagonal-07
# and diagonal-08 are identical setups, so the guard params below are kept in
# lockstep with diagonal-08.yaml — keep the two in sync.

robot:
  type: bi_elite_cs66_rt
  bi_mount_type: diagonal-07 # IPs below match the diagonal-07 station file
  left_robot_ip: 192.168.207.129
  right_robot_ip: 192.168.207.108
  control_mode: cartesian_servo # cartesian_servo | joint_servo
  servoj_gain: 300 # [100, 2000]
  left_use_gripper: true
  right_use_gripper: true
  enable_tactile_sensors: true
  # ── Payload (tool + gripper) ── declared via setPayload so the F/T-less collision
  # detection doesn't read the tool's own weight/inertia as external force and stop on
  # light contact (e.g. wiping). Verified fleet value; raise mass if the tool is heavier.
  # (Collision *sensitivity/threshold* itself is a controller safety setting — pendant.)
  payload_mass: 0.7           # kg
  payload_cog: [0.0, 0.0, 0.19] # m, relative to flange
  # ── Gripper: bi_taccap (TacCap follower, MIT impedance) ──
  # Both grippers -> xense.taccap FollowerGripper; wrist + GSPS tactile cameras are
  # auto-discovered at connect (the station's XC*/OG* SNs are ignored in this mode).
  # gripper_f_max is a serial-gripper knob and does not apply here.
  gripper_type: taccap_follower
  taccap_kp: 8.0          # MIT impedance stiffness (Nm/rad)
  taccap_kd: 1.0          # MIT impedance damping (Nm·s/rad)
  # ⚠️ HIGH GRIP FORCE — constant closing feed-forward torque. NEGATIVE = clamp.
  # -3.0 Nm is ~10x the SDK gentle-grasp abort (0.30 Nm) and near the motor's ceiling:
  # it is a hard crush. It is a CONSTANT bias, so the jaw also settles ~3/kp≈0.375 rad
  # short of full open and holds the closed stop under load even empty (runs hot). Back
  # off toward -0.3 if it stalls the motor / can't open / overheats. Bounded |ff|<=3.5.
  taccap_grip_ff: -3.0    # constant MIT feed-forward torque (Nm), negative = closing
  taccap_control_hz: 200  # ControlLoop resubmit rate
  taccap_auto_discover_cameras: true

  # ── Singularity / joint-overspeed guards (fixes the down-near-table trips) ──
  # Predicted joint-velocity guard (model-based, needs NO live tuning): bounds the
  # predicted joint step BEFORE the controller IK spikes past JOINT_IGNORE_SPEED
  # (30 rad/s) and drops external control. Naturally directional — holds motion
  # INTO a wrist(q5≈0)/elbow/boundary singularity, allows escape. Uses DH fetched
  # per-arm at connect + these datasheet CS66 rates (J1/J2 150°/s, J3 180°/s,
  # J4-6 230°/s). Watch the connect log for "Kinematic scaling enabled
  # [joint-vel-limit]"; if it logs "...disabled" the DH fetch / FK self-check
  # failed and the guard fail-safes off (resolve DH before relying on it).
  joint_vel_limits_rad_s: [2.618, 2.618, 3.142, 4.014, 4.014, 4.014]
  joint_vel_limit_margin: 0.8 # enforce at 80% of the limits; lower (e.g. 0.6) for more headroom
  log_manipulability: true # DIAG: print per-tick w / sigma_min / s / s_jv (turn off in production)

  # ── Manipulability (w-band) damping — THE fix for the "extend → IK refuses" trips ──
  # Trip diagnosis (session 14:04, left): reaching out SLOWLY, w=|det(J)| fell 0.084→0.020 and the
  # controller REFUSED the near-singular target (qdot_tgt=0 — NOT an overspeed; the joint-vel guard
  # saw tiny velocities and stayed s_jv=1 the whole way down, so it structurally cannot catch this).
  # This directional w-band slows the command as w drops so the operator feels resistance BEFORE the
  # ~0.02 IK-refusal, while leaving retraction (escape / rising w) free. Thresholds from the live w
  # trace (normal ~0.08, refuse ~0.02): raise singularity_w_low toward 0.035 if it still trips; lower
  # singularity_w_high toward 0.04 if it damps legit reach too early. Watch "manipulability w=.. -> s=..".
  singularity_directional: true
  singularity_w_high:
    0.055 # begin damping only just above the hold — narrowed from 0.065 because the
    # RIGHT arm's normal table work sits at w~0.045-0.06 and was being damped
    # 95% of the time ("not tracking the hand"). At 0.055 its w>0.055 moves run
    # free; only w in 0.05-0.055 ramps, w<=0.05 holds.
  singularity_w_low: 0.05 # TRUE hold at/below this — ABOVE the highest observed refusal (w=0.047).
  singularity_min_scale:
    0.0 # 0 = full hold into the singularity (no creep-through); OK because
    # directional=true still lets any escape / retraction (rising w) run free.
    # NOTE: refusal-w varies 0.015-0.043 across configs and overlaps normal
    # working w (dips to ~0.058), so w_high=0.06 will damp some deep reaches —
    # accepted as the safety trade-off. Watch the now-per-tick w->s log.
  # Per-servo-tick velocity ceiling — smooths jumpy Pico4 wrist tracking at the source.
  max_lin_speed: 0.25 # m/s
  max_ang_speed: 1.0 # rad/s (matches the Bi-Pico4 max_rot_velocity default)

  # NOTE: max_reach_radius intentionally left OFF (config default None). The 2026-07-09
  # trip was NOT a reach-boundary problem — the flange was at 0.82 m (well inside the
  # ~0.91 m reach) in a near-singular direction (w=0.051), and a base-origin sphere is
  # the wrong model anyway (the ~194mm tool makes TCP-distance a poor reach proxy). The
  # real fix is the model-based joint-vel guard, which is now enabled once the FK
  # self-check passes on position (see the singularity_* / joint_vel_* handling).

teleop:
  type: bi_pico4
  pos_sensitivity: 1.0
  ori_sensitivity: 1.0

# ── Teleoperate loop (top level) ──
fps: 30
display_data: true
