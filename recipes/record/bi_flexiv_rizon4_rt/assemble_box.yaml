# Record recipe — bimanual Flexiv Rizon4 RT (forward mount, bench 06) + Bi-Pico4.
#   lerobot-record --config_path=recipes/record/bi_flexiv_rizon4_rt/assemble_box.yaml
#
# Self-contained: this file carries both the bench hardware and the run's tuning.
# Anything not listed uses the dataclass default.

robot:
  type: bi_flexiv_rizon4_rt

  # ── Bench hardware (forward-06) ─────────────────────────────────────────────
  # Joint angles are in DEGREES (J1..J7), the units flexiv_rt takes.
  # Only the head is pinned: both gripper backends sniff their own wrist +
  # tactile cameras off the gripper's USB hub at connect.
  left_robot_sn: Rizon4s-062412
  right_robot_sn: Rizon4s-062881
  left_start_position_degree: [88.79, 74.96, 22.75, 112.75, -0.39, 86.74, 1.24]
  right_start_position_degree: [-24.41, 71.36, -4.67, 118.53, 3.91, 96.15, 3.6]
  left_home_position_degree: [88.79, 74.96, 22.75, 112.75, -0.39, 86.74, 1.24]
  right_home_position_degree: [-24.41, 71.36, -4.67, 118.53, 3.91, 96.15, 3.6]
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "254322071102"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false
    # Wrist + tactile are discovered off each gripper's USB hub at connect
    # (gripper.auto_discover_cameras). What this bench had when the pins were
    # removed, for cross-checking the first discovery run:
    #   left_tactile_0: OG001323
    #   left_tactile_1: OG001324
    #   left_wrist: XC000035
    #   right_tactile_0: OG001325
    #   right_tactile_1: OG001326
    #   right_wrist: XC000036

  # ── Control ─────────────────────────────────────────────────────────────────
  use_force: false
  log_level: INFO
  # ── Gripper ── One block for both arms; `side` is stamped per arm at build time.
  gripper:
    type: serial
    gripper_v_max: 100.0    # mm/s
    gripper_f_max: 40.0    # N
    gripper_min_pos: 0.0    # mm — fully closed
    gripper_max_pos: 85.0   # mm — fully open
    serial_timeout: 1.0
    init_open: true
    # Everything else worth tuning, at its default — uncomment to change.
    # auto_discover_cameras: true        # sniff wrist + tactile off this gripper's USB hub
    # port: ""                            # explicit /dev path; overrides sn + side
    # sn: null                            # board SN; scanned across ports when port unset
    # side: null                          # stamped automatically per arm — do not set here
  left_use_gripper: true
  right_use_gripper: true
  enable_tactile_sensors: true

teleop:
  type: bi_pico4
  pos_sensitivity: 1.0
  ori_sensitivity: 1.0

dataset:
  repo_id: Xense/assemble_box_with_phone_stand0430_merged
  single_task: "Assemble the packaging by folding the flat box into shape, placing the metal phone stand inside, and closing the box properly"
  fps: 30 # must equal teleop fps
  episode_time_s: 600
  reset_time_s: 120
  num_episodes: 5
  video: true
  push_to_hub: true

# ── Record loop (top level) ──
display_data: false
resume: true
