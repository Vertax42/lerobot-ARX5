# Record recipe — bimanual Flexiv Rizon4 RT (forward mount, bench 06) + Bi-Pico4,
# with TacCap follower grippers. A short smoke-test recording, not a task.
#   lerobot-record --config_path=recipes/record/bi_flexiv_rizon4_rt/test-0819-taccap.yaml
#
# Different pair from assemble_box-{taccap,xgripper}.yaml, which run
# Rizon4s-062412/062881; this one exists to exercise the record loop rather
# than to collect data.
#
# Self-contained: this file carries both the bench hardware and the run's tuning.
# Anything not listed uses the dataclass default.
#
# Gripper variant: taccap. The sibling assemble_box-xgripper.yaml is the same bench
# with the other gripper family — the two differ only in `gripper:`.
#
# NOT yet run on this bench with TacCap followers — the arm block is this pair's
# own start/home pose, the gripper block is the fleet default. Grip tuning
# (feedforward_torque) is bench work; start gentle.

robot:
  type: bi_flexiv_rizon4_rt

  # ── Bench hardware (forward-01) ─────────────────────────────────────────────
  left_robot_sn: Rizon4s-063458
  right_robot_sn: Rizon4s-063670
  # Joint angles in DEGREES (J1..J7), the units flexiv_rt takes.
  left_start_position_degree: [88.62, 74.83, 22.87, 112.79, -0.55, 87.02, 0.72]
  right_start_position_degree: [-24.33, 71.20, -4.84, 118.72, 3.88, 95.72, 3.64]
  left_home_position_degree: [88.62, 74.83, 22.87, 112.79, -0.55, 87.02, 0.72]
  right_home_position_degree: [-24.33, 71.20, -4.84, 118.72, 3.88, 95.72, 3.64]

  # ── Cameras ─────────────────────────────────────────────────────────────────
  # Only the head is pinned: taccap_auto_discover_cameras (below) sniffs the
  # per-side wrist + GSPS tactile cameras off each gripper's USB hub at connect.
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "337322070722"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false

  # ── Control ─────────────────────────────────────────────────────────────────
  use_force: false
  log_level: INFO
  enable_tactile_sensors: true

  # ── Wrist fisheye rectification ── TacCap only; the XGripper family has no
  # firmware calibration to read. Reaches the auto-discovered wrist cameras only
  # (a wrist camera pinned by hand carries its own `undistort` field instead).
  #
  # Intrinsics come off each gripper's MCU flash. A unit whose firmware holds
  # none falls back to the SDK's shared reference values and warns; those are
  # close but not this unit's, so calibrate before measuring in pixels off a
  # rectified frame. Needs the calibrated 640x480 — any other size is refused at
  # connect rather than silently mis-rectified.
  #
  # Off here, as it has been on every bench so far. Uncomment to turn it on.
  # undistort_wrist_cameras: false
  # wrist_fisheye_balance: 0.0          # 0 = calibrated focal length; 1 = 0.70x, widest FOV

  # ── Gripper ── One block for both arms; `side` is stamped per arm at build time.
  # Both grippers -> xense.taccap FollowerGripper (matched pair, single switch).
  # auto_discover_cameras sniffs the wrist + GSPS tactile SNs off each gripper's
  # USB hub at connect, which is why only the head camera is pinned above.
  gripper:
    type: taccap_follower
    kp: 8.0 # MIT impedance stiffness (Nm/rad)
    kd: 1.0 # MIT impedance damping (Nm·s/rad)
    feedforward_torque: 0.0 # Nm; negative = clamp harder. |ff| <= 3.5
    control_hz: 200 # ControlLoop resubmit rate
    auto_discover_cameras: true
    require_calibrated: true
    init_open: true
    # Everything else worth tuning, at its default — uncomment to change.
    # side: left                          # stamped automatically per arm — do not set here
    # mcu_device: null                    # explicit MCU path; the arm fills this from discovery
  left_use_gripper: true
  right_use_gripper: true

teleop:
  type: bi_pico4
  pos_sensitivity: 1.0
  ori_sensitivity: 1.0

dataset:
  repo_id: Xense/bi_flexiv_rizon4_rt_test-0819
  single_task: "test-0819"
  fps: 30 # must equal teleop fps
  episode_time_s: 600
  reset_time_s: 120
  num_episodes: 5
  video: true
  push_to_hub: false

# ── Record loop (top level) ──
display_data: false
resume: false
