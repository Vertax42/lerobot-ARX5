# This workflow handles secret scanning using TruffleHog to detect sensitive information in the codebase.
name: Security
permissions:
  contents: read

# Disarmed for this fork: superseded by ci.yml's hook set (gitleaks, bandit, zizmor).
# Kept rather than deleted so it can be restored by putting its triggers back;
# see ci.yml for the checks this repository does run.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # This job runs TruffleHog to scan the full history of the repository for secrets.
  trufflehog:
    name: Secret Leaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@v3.90.0  # zizmor: ignore[unpinned-uses]
        with:
          extra_args: --only-verified
